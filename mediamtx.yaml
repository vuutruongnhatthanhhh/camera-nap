hlsVariant: lowLatency
hlsSegmentCount: 3
hlsSegmentDuration: 1s
hlsPartDuration: 200ms

webrtc: no  # Tắt hẳn WebRTC nếu không dùng đến để đỡ rối cổng
rtsp: yes
hls: yes

paths:
  warehouse_cam:
    source: __CAMERA_SOURCE__ # run-mediamtx.ps1 thay chỗ này bằng rtsp://user:pass@ip lấy từ .env
    sourceOnDemand: no